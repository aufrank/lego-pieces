[project]
name = "lego-pieces"
version = "0.1.0"
description = "Which LEGO pieces do our instruction builds use most?"
authors = [
    { name = "Austin F. Frank", email = "austin.frank@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gallery-dl>=1.32.14",
]

[project.scripts]
lego-pieces = "lego_pieces:main"
crawl-brickmecha = "lego_pieces.brickmecha:main"
fetch-rebrickable = "lego_pieces.rebrickable:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
